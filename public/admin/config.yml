backend:
  name: github
  repo: Rutwik2003/hp-omen-docs # <--- REPLACE THIS with your actual 'username/repo'
  branch: main
  # base_url: https://your-oauth-app.vercel.app # You will set this up later for production

# This allows you to test the CMS locally without any login!
local_backend: true 

# This allows public users to submit content via Pull Requests
publish_mode: editorial_workflow
open_authoring: true
media_library:
  name: uploadcare
  config:
    publicKey: demopublickey # Optional: Replace if using external media service

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "quickstart"
    label: "Quick Start Guides"
    folder: "src/content/quickstart"
    create: true
    slug: "{{slug}}"
    format: "json" 
    fields:
      - {label: "ID (URL Slug)", name: "id", widget: "string"}
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Description", name: "description", widget: "text"}
      - {label: "Category", name: "category", widget: "string", default: "Quick Start"}
      - {label: "Metadata", name: "metadata", widget: "object", fields: [
          {label: "Difficulty", name: "difficulty", widget: "select", options: ["Beginner", "Intermediate", "Advanced"]},
          {label: "Read Time", name: "readTime", widget: "string", default: "15 mins"},
          {label: "Last Updated", name: "lastUpdated", widget: "string", default: "Jan 2026"}
        ]}
      - {label: "Steps", name: "steps", widget: "list", fields: [
          {label: "Step Title", name: "title", widget: "string"},
          {label: "Content (HTML allowed)", name: "content", widget: "markdown"},
          {label: "Info Box", name: "infoBox", widget: "object", required: false, fields: [
              {label: "Type", name: "type", widget: "select", options: ["info", "warning", "success", "tip", "danger"]},
              {label: "Title", name: "title", widget: "string"},
              {label: "Content", name: "content", widget: "string"}
          ]},
          {label: "Prerequisites", name: "prerequisites", widget: "list", required: false}
        ]}

  - name: "windows"
    label: "Windows Guides"
    folder: "src/content/windows"
    create: true
    slug: "{{slug}}"
    format: "json"
    fields:
      - {label: "ID (URL Slug)", name: "id", widget: "string"}
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Description", name: "description", widget: "text"}
      - {label: "Category", name: "category", widget: "string", default: "Windows"}
      - {label: "Metadata", name: "metadata", widget: "object", fields: [
          {label: "Difficulty", name: "difficulty", widget: "select", options: ["Beginner", "Intermediate", "Advanced"]},
          {label: "Read Time", name: "readTime", widget: "string"},
          {label: "Last Updated", name: "lastUpdated", widget: "string"}
        ]}
      - {label: "Steps", name: "steps", widget: "list", fields: [
          {label: "Step Title", name: "title", widget: "string"},
          {label: "Content", name: "content", widget: "markdown"},
        ]}

  - name: "performance"
    label: "Performance Guides"
    folder: "src/content/performance"
    create: true
    slug: "{{slug}}"
    format: "json"
    fields:
      - {label: "ID (URL Slug)", name: "id", widget: "string"}
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Description", name: "description", widget: "text"}
      - {label: "Category", name: "category", widget: "string", default: "Performance"}
      - {label: "Metadata", name: "metadata", widget: "object", fields: [
          {label: "Difficulty", name: "difficulty", widget: "select", options: ["Beginner", "Intermediate", "Advanced"]},
          {label: "Read Time", name: "readTime", widget: "string"},
          {label: "Last Updated", name: "lastUpdated", widget: "string"}
        ]}
      - {label: "Steps", name: "steps", widget: "list", fields: [
          {label: "Step Title", name: "title", widget: "string"},
          {label: "Content", name: "content", widget: "markdown"},
        ]}
